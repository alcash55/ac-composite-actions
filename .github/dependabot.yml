version: 2

updates:
  # Workflow-level pins: actions/checkout, actions/setup-node,
  # oven-sh/setup-bun in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # notifications and notifications/discord-messages each pin an external
  # action directly in their own action.yml (oven-sh/setup-bun,
  # MineBartekSA/discord-webhook), rather than only calling other actions
  # in this repo, so each needs its own entry to get version bumps.
  - package-ecosystem: "github-actions"
    directory: "/notifications"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/notifications/discord-messages"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Every yarn-based action directory, plus the repo root's own
  # yarn.lock. "npm" is Dependabot's ecosystem name for both npm and
  # yarn manifests -- it reads whichever lockfile is actually there.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ats-check"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/diff"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/format-message"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/accessibility/axe-check"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/markdown-checks/spellcheck"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # notifications is bun-tooled (bun.lockb), unlike every other action
  # directory here.
  - package-ecosystem: "bun"
    directory: "/notifications"
    target-branch: "dev"
    schedule:
      interval: "weekly"
