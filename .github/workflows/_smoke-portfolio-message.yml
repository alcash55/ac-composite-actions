name: Smoke test portfolio-message.yml (temporary)

# Not part of the fix. Exists only to drive portfolio-message.yml with a
# real workflow_call invocation so the inputs-vs-secrets context fix can be
# read straight out of a GitHub Actions log instead of reasoned about.
# WEBHOOK_URL below is a placeholder, not a real webhook -- the request to
# Discord is expected to fail; what this checks is which value reaches the
# composite action's own logged `with:` block. Deleted before merge.
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    uses: ./.github/workflows/portfolio-message.yml
    with:
      MESSAGE: "smoke test, ignore"
      WEBHOOK_URL: "https://discord.com/api/webhooks/000000000000000000/smoke-test-placeholder-not-real"
      AVATAR_URL: "https://example.com/avatar.png"
