name: Send Discord Message Via Webhook
on:
  workflow_call:
    inputs:
      MESSAGE:
        required: true
        type: string
      WEBHOOK_URL:
        required: true
        type: string
      AVATAR_URL:
        required: false
        type: string

# This workflow never checks out the repo and never calls the GitHub API —
# it only posts to a Discord webhook — so it needs no token scope at all.
permissions: {}

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: 📩 Send Discord Message
        uses: alcash55/ac-composite-actions/notifications/discord-messages@main
        with:
          WEBHOOK_URL: ${{ inputs.WEBHOOK_URL }}
          MESSAGE: ${{ inputs.MESSAGE }}
          AVATAR_URL: ${{ inputs.AVATAR_URL }}
