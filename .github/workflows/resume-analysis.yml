name: Resume Analysis
on:
  workflow_call:
    inputs:
      RESUME:
        description: "Path to the resume PDF file (relative to the repo root)"
        required: true
        type: string
      ORG:
        description: "GitHub owner and repository name (e.g., 'username/repository')"
        required: true
        type: string
      BRANCH:
        description: "Name of the branch from the calling repository"
        required: true
        type: string
      PR_NUMBER:
        description: "The number that identifies the pull request"
        required: true
        type: number
      ATS_THRESHOLD:
        description: "Minimum ATS score (integer, 0-100) that counts as passing. A lower score warns but does not fail the job."
        required: false
        type: number
        default: 70
    secrets:
      GH_TOKEN:
        description: "The token that identifies the actor who triggered the workflow"
        required: true
      APILAYER_API_KEY:
        description: API key for the APILayer Resume Parser
        required: true

# Checkout is the only step here that draws on the ambient GITHUB_TOKEN.
# Every GitHub API call this workflow makes (the diff, the PR comment, the
# failure notice) goes through the explicitly-passed secrets.GH_TOKEN input
# instead, so no elevated scope is needed for those.
permissions:
  contents: read

concurrency:
  group: ac-resume-analysis-${{ github.workflow }}-${{ inputs.PR_NUMBER }}-${{ inputs.RESUME }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      # ats-check reads the resume PDF from disk (github.workspace) and spellcheck
      # now prefers reading changed files from disk over the GitHub API — both
      # need the calling repo checked out first, which this workflow never did.
      - name: 📂 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.BRANCH }}

      - name: 🔍 Get Diff
        id: diff
        uses: alcash55/ac-composite-actions/diff@main
        with:
          GITHUB_ORG: ${{ inputs.ORG }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 🔤 Spell Check
        id: spell_check
        uses: alcash55/ac-composite-actions/markdown-checks/spellcheck@main
        with:
          DIFF: ${{ steps.diff.outputs.DIFF }}
          GITHUB_ORG: ${{ inputs.ORG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: ${{ inputs.BRANCH }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          COMMENT_KEY: ${{ inputs.RESUME }}

      - name: 🖨️ ATS Check
        id: ats_check
        uses: alcash55/ac-composite-actions/ats-check@main
        with:
          RESUME: ${{ inputs.RESUME }}
          APILAYER_API_KEY: ${{ secrets.APILAYER_API_KEY }}
          ATS_THRESHOLD: ${{ inputs.ATS_THRESHOLD }}
          # No COMMENT_KEY: ats-check names the comment after the RESUME file,
          # so a matrix over several PDFs keeps one ATS comment per resume.
          # It needs a PR-triggered caller; explicit values because this
          # workflow's own token is read-only.
          GITHUB_ORG: ${{ inputs.ORG }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # The failure notice is keyed by RESUME, so a matrix over several PDFs
      # keeps one notice per resume. The old notice went through the legacy
      # heading match, where each variant deleted the one before it (#105).
      - name: 🚨 Notify Step Errors
        id: step_errors
        if: failure()
        uses: alcash55/ac-composite-actions/notifications/pr-comment@main
        with:
          KIND: failure
          COMMENT_KEY: ${{ inputs.RESUME }}
          DATA: >-
            {"workflow": "Resume analysis",
            "subject": ${{ toJSON(inputs.RESUME) }},
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          GITHUB_ORG: ${{ inputs.ORG }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Empty DATA removes this resume's notice, so a passing re-run clears it.
      - name: 🧹 Clear Failure Notice
        if: success()
        uses: alcash55/ac-composite-actions/notifications/pr-comment@main
        with:
          KIND: failure
          COMMENT_KEY: ${{ inputs.RESUME }}
          DATA: ""
          GITHUB_ORG: ${{ inputs.ORG }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
