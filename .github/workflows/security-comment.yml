name: Secret scan comment implementation
on:
  workflow_call:
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  comment:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout in the privileged job. Only download the bounded JSON
      # artifact from the exact workflow_run that triggered this reporter.
      - name: Find scan artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.name !== 'Secret scan') throw new Error('Unexpected source workflow.');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const matches = artifacts.filter(a => a.name === 'secret-scan-result' && !a.expired);
            if (matches.length === 0) {
              core.notice('No result artifact. The scan may have failed before producing findings.');
              return;
            }
            if (matches.length !== 1 || matches[0].size_in_bytes > 150000) {
              throw new Error('Unexpected secret scan artifact size or count.');
            }
            core.setOutput('found', 'true');
      - name: Download redacted result
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: secret-scan-result
          path: ${{ runner.temp }}/secret-scan-result
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify and comment
        if: steps.artifact.outputs.found == 'true'
        uses: alcash55/ac-composite-actions/security/betterleaks/comment@fa48a8081ab97249664f9cdd82e43954e4dafcf5
        with:
          REPORT_PATH: ${{ runner.temp }}/secret-scan-result/result.json
