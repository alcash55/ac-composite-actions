# https://blog.apilayer.com/everything-you-need-to-know-for-the-resume-parser-api/
name: ATS Check
description: Parse a resume PDF and score its ATS compatibility

inputs:
  RESUME:
    description: Path to the resume PDF file (relative to the repo root)
    required: true
  APILAYER_API_KEY:
    description: API key for the APILayer Resume Parser
    required: true
  GH_TOKEN:
    description: Token that can write PR comments. Defaults to the job's GITHUB_TOKEN.
    required: false
    default: ""
  GITHUB_ORG:
    description: <github owner>/<github repo> to comment on. Defaults to the repository running the workflow.
    required: false
    default: ""
  PR_NUMBER:
    description: Pull request to comment on. Defaults to the PR that triggered the workflow.
    required: false
    default: ""
  ATS_THRESHOLD:
    description: >
      Minimum score (integer, 0-100) that counts as passing. Sets ATS_PASSED,
      the comment verdict, and the report's threshold line. A failing score
      only warns; it never fails the job.
    required: false
    default: "70"
  COMMENT_KEY:
    description: >
      Tells this resume's PR comment apart from other ats-check runs on the
      same pull request. Defaults to the resume's filename without its
      extension (`resume/fullstack.pdf` owns the `ats-fullstack` comment).
      Any text; it is slugified into the hidden marker.
    required: false
    default: ""
  COMMENT_ON_PR:
    description: >
      Post the result as a pull request comment when the workflow is
      triggered by pull_request or pull_request_target, update it in place on
      later runs, and remove it once the check is clean. Set to "false" to
      turn it off. Commenting never fails the check: without
      `pull-requests: write` (or on a fork PR, which gets a read-only token)
      the action warns and continues.
    required: false
    default: "true"

outputs:
  ATS_SCORE:
    description: Overall ATS compatibility score (0-100), at or above ATS_THRESHOLD (default 70) is considered passing
    value: ${{ steps.ats_check.outputs.ATS_SCORE }}
  ATS_REPORT:
    description: Detailed ATS compatibility report as a markdown string
    value: ${{ steps.ats_check.outputs.ATS_REPORT }}
  ATS_PASSED:
    description: Boolean, true if the score is at or above ATS_THRESHOLD
    value: ${{ steps.ats_check.outputs.ATS_PASSED }}
  ATS_RESUME:
    description: File name of the resume that was scored, such as fullstack.pdf
    value: ${{ steps.ats_check.outputs.ATS_RESUME }}

runs:
  using: "composite"
  steps:
    - name: ATS Check
      id: ats_check
      shell: bash
      # Runs the committed dist/index.js bundle (yarn build / esbuild) — no
      # install step. ci.yml's build-check job rebuilds dist/ from source on
      # every PR and fails if the committed bundle has drifted.
      run: |
        if [ -z "$RESUME_PARSER_API_KEY" ]; then
          echo "ERROR: RESUME_PARSER_API_KEY env var is empty."
          echo "Input length: ${#RESUME_PARSER_API_KEY}"
          echo "Raw input value repr: '$(echo -n "$RESUME_PARSER_API_KEY" | xxd | head -1)'"
          exit 1
        fi
        node "${{ github.action_path }}/dist/index.js"
      env:
        RESUME: ${{ github.workspace }}/${{ inputs.RESUME }}
        RESUME_PARSER_API_KEY: ${{ inputs.APILAYER_API_KEY }}
        ATS_THRESHOLD: ${{ inputs.ATS_THRESHOLD }}
        COMMENT_KEY: ${{ inputs.COMMENT_KEY }}

    # Own marker (`ats-<resume name>`), so this comment never collides with the spellcheck or axe
    # comment on the same PR. A passing score still gets a comment, since the
    # score is the result the author wants to see.
    - name: Comment on the pull request
      id: comment
      if: ${{ steps.ats_check.outcome == 'success' }}
      uses: alcash55/ac-composite-actions/notifications/pr-comment@main
      with:
        KIND: ats
        COMMENT_KEY: ${{ steps.ats_check.outputs.ATS_COMMENT_KEY }}
        DATA: ${{ toJSON(steps.ats_check.outputs) }}
        COMMENT_ON_PR: ${{ inputs.COMMENT_ON_PR }}
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        GITHUB_ORG: ${{ inputs.GITHUB_ORG }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
