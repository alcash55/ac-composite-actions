name: Format Message
description: Take message JSON and format them for the corresponding

inputs:
  SPELL_MESSAGE:
    description: Unformatted spell check message
    required: true

outputs:
  FORMATTED_MESSAGE:
    description: formatted message for desired communication channel
    value: ${{ steps.format_msg.outputs.FORMATTED_MESSAGE }}

runs:
  using: "composite"
  steps:
    - name: 🔨 Format Notification
      shell: bash
      id: format_msg
      # Runs the committed dist/index.js bundle (yarn build / @vercel/ncc) —
      # no install step. ci.yml's build-check job rebuilds dist/ from source
      # on every PR and fails if the committed bundle has drifted.
      run: |
        node "${{ github.action_path }}/dist/index.js"
      env:
        SPELL_MESSAGE: ${{ inputs.SPELL_MESSAGE }}
