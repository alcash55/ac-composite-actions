name: spell check
description: using Cspell to check the spelling from the input DIFF files

inputs:
  DIFF:
    description: List of space delimted files from pull request to be checked
    required: true
  BRANCH:
    description: name of the ref where the content should be spell checked
    required: true
  GITHUB_ORG:
    description: <github owner/github repo>
    required: true
  GH_TOKEN:
    description: token for the use triggering the wf
    required: true
outputs:
  SPELL_ERRORS:
    description: JSON array of { file, output } entries, one per file with spelling issues. Always set, "[]" when there are none.
    value: ${{ steps.spellcheck.outputs.SPELL_ERRORS }}

runs:
  using: composite
  steps:
    - name: 🔠 Spell Check
      id: spellcheck
      shell: bash
      # Wrapped in ${{ }} so the whole comparison is one expression. Unwrapped,
      # GitHub interpolates DIFF into the condition before it is parsed, so a
      # two-file DIFF becomes the invalid `a.md b.md != ''`.
      if: ${{ inputs.DIFF != '' }}
      run: |
        cd ${{ github.action_path }}
        yarn install --frozen-lockfile --production --non-interactive
        yarn spell
      env:
        DIFF: ${{ inputs.DIFF }}
        GITHUB_ORG: ${{ inputs.GITHUB_ORG }}
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        BRANCH: ${{ inputs.BRANCH }}
        # Config lives one directory up, shared with the rest of markdown-checks.
        CSPELL_CONFIG_PATH: ${{ github.action_path }}/../.cspell.json
