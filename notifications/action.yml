name: notifications
description: Send notifications through github and discord

inputs:
  MESSAGE:
    description: Message to be sent to either Discord or GitHub
    required: true
  MESSAGE_TYPE:
    description: Where to send the message, 'discord' or 'github'
    required: true
  GITHUB_ORG:
    description: <github owner/github repo>
    required: false
  PR_NUMBER:
    description: The number that identifies the pull request
    required: false
  GH_TOKEN:
    description: Token for the use triggering the wf
    required: false
  WEBHOOK_URL:
    description: Discord webhook URL — required when MESSAGE_TYPE is 'discord'
    required: false

runs:
  using: "composite"
  steps:
    # The two GitHub steps below shell out to bun, and this action is
    # consumed at @main with no tag, so a caller-side bun setup would leave
    # every other caller broken the moment this file changes (see #59).
    # Scoped to MESSAGE_TYPE == 'github' so a discord-only caller doesn't
    # pay for a runtime it never uses. Version pinned to match ci.yml /
    # node-ci.yml so the lockfile behaves the same here as in CI. Safe to
    # run even when the caller already set up bun: setup-bun just
    # reinstalls and re-prepends PATH, a no-op when the version matches and
    # a harmless few extra seconds when it doesn't.
    - name: Setup Bun
      if: ${{ inputs.MESSAGE_TYPE == 'github' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.1.34"

    - name: Delete Old GitHub Pull Request Comment (if exists)
      id: delete_pr_msg
      shell: bash
      if: ${{ inputs.MESSAGE_TYPE == 'github' }}
      run: |
        cd ${{ github.action_path }}
        bun install --frozen-lockfile --production
        bun run deleteGithubMessage
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
        ORG: ${{ inputs.GITHUB_ORG }}

    - name: Send GitHub Pull Request Comment
      id: send_pr_msg
      shell: bash
      # Nothing to post when MESSAGE is empty (e.g. a clean spellcheck run) —
      # posting an empty comment would just be noise on the PR.
      if: ${{ inputs.MESSAGE_TYPE == 'github' && inputs.MESSAGE != '' }}
      run: |
        cd ${{ github.action_path }}
        bun install --frozen-lockfile --production
        bun run sendGithubMessage
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
        ORG: ${{ inputs.GITHUB_ORG }}
        MESSAGE: ${{ inputs.MESSAGE }}

    - name: Send Discord Message
      id: send_discord_msg
      if: ${{ inputs.MESSAGE_TYPE == 'discord' }}
      # Delegates to the finished discord-messages action rather than the
      # (empty) discordMessage script — see notifications/discord-messages.
      uses: alcash55/ac-composite-actions/notifications/discord-messages@main
      with:
        WEBHOOK_URL: ${{ inputs.WEBHOOK_URL }}
        MESSAGE: ${{ inputs.MESSAGE }}
