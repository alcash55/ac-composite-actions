name: notifications
description: Send notifications through github and discord

inputs:
  MESSAGE:
    description: Message to be sent to either Discord or GitHub
    required: true
  MESSAGE_TYPE:
    description: Where to send the message, 'discord' or 'github'
    required: true
  GITHUB_ORG:
    description: <github owner/github repo>
    required: false
  PR_NUMBER:
    description: The number that identifies the pull request
    required: false
  GH_TOKEN:
    description: Token for the use triggering the wf
    required: false
  WEBHOOK_URL:
    description: Discord webhook URL — required when MESSAGE_TYPE is 'discord'
    required: false

runs:
  using: "composite"
  steps:
    # Both GitHub steps run the committed dist/ bundle (bun run build /
    # esbuild) under node, not bun — no install step, and no Setup Bun step
    # either (closes #75, where a caller-side bun setup leaked its version
    # into every later step's PATH).
    #
    # #59 pinned bun to 1.1.38 at runtime because @actions/core pulls in
    # @actions/http-client@4, which imports ProxyAgent from undici, and
    # Bun's own built-in undici shim doesn't export it until 1.1.38
    # (oven-sh/bun#4474). Bundling sidesteps that gap rather than working
    # around it: esbuild inlines the real undici package these scripts
    # actually depend on (@actions/http-client's own dependency, not Bun's
    # substitute), so the shim Bun would otherwise substitute never enters
    # the picture. Confirmed the bundle loads cleanly under bun 1.1.34 too,
    # but there's no reason to run it under bun at all once nothing here is
    # bun-specific — every other bundled action in this repo already runs
    # its dist/ under node.
    - name: Delete Old GitHub Pull Request Comment (if exists)
      id: delete_pr_msg
      shell: bash
      if: ${{ inputs.MESSAGE_TYPE == 'github' }}
      run: |
        node "${{ github.action_path }}/dist/delete-comment/index.js"
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
        ORG: ${{ inputs.GITHUB_ORG }}

    - name: Send GitHub Pull Request Comment
      id: send_pr_msg
      shell: bash
      # Nothing to post when MESSAGE is empty (e.g. a clean spellcheck run) —
      # posting an empty comment would just be noise on the PR.
      if: ${{ inputs.MESSAGE_TYPE == 'github' && inputs.MESSAGE != '' }}
      run: |
        node "${{ github.action_path }}/dist/send-comment/index.js"
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}
        ORG: ${{ inputs.GITHUB_ORG }}
        MESSAGE: ${{ inputs.MESSAGE }}

    - name: Send Discord Message
      id: send_discord_msg
      if: ${{ inputs.MESSAGE_TYPE == 'discord' }}
      # Delegates to the finished discord-messages action rather than the
      # (empty) discordMessage script — see notifications/discord-messages.
      uses: alcash55/ac-composite-actions/notifications/discord-messages@main
      with:
        WEBHOOK_URL: ${{ inputs.WEBHOOK_URL }}
        MESSAGE: ${{ inputs.MESSAGE }}
