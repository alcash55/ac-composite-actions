name: PR comment
description: >
  Posts a checker action's result (spellcheck, axe, ATS) as one pull request
  comment that later runs update in place, and removes it when the check is
  clean. Used by the checker actions themselves; a caller rarely needs it.
  By default it never fails the job: a missing permission or a fork PR becomes
  a warning. Set FAIL_ON_ERROR to make a failed write fail the job.

inputs:
  KIND:
    description: Which checker produced DATA, 'spellcheck', 'axe', 'ats', 'secrets', or 'failure' (a workflow's failure notice). Also names the comment's hidden marker, with COMMENT_KEY appended.
    required: true
  DATA:
    description: >
      The checker's output as JSON. spellcheck: SPELL_ERRORS. axe:
      AXE_VIOLATIONS. ats: the whole ats-check outputs object
      (toJSON(steps.<id>.outputs)). secrets: redacted FINDINGS array.
      failure: { workflow, subject, run_url }.
      An empty string or a clean result removes
      the old comment.
    required: true
  COMMENT_ON_PR:
    description: Set to 'false' to turn commenting off.
    required: false
    default: "true"
  GH_TOKEN:
    description: Token that can write PR comments. Defaults to the job's GITHUB_TOKEN, which needs `pull-requests - write`.
    required: false
    default: ""
  GITHUB_ORG:
    description: <github owner>/<github repo>. Defaults to the repository running the workflow.
    required: false
    default: ""
  COMMENT_KEY:
    description: >
      Tells apart several runs of one KIND on the same PR (three resume PDFs,
      two axe sites). Slugified to [a-z0-9-] and appended to the marker, so
      KIND ats with key "fullstack" owns the `ats-fullstack` comment. Empty
      keeps the plain KIND marker.
    required: false
    default: ""
  PR_NUMBER:
    description: >
      Pull request to comment on. Defaults to the PR that triggered the workflow.
      A workflow_run reporter has no PR event, so it passes the number it verified
      and that is what lets the action comment there.
    required: false
    default: ""
  FAIL_ON_ERROR:
    description: Set to 'true' to fail the job when the comment cannot be formatted or written. A reporter job whose only work is the comment wants this.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Both steps run the committed notifications/dist bundles under node, with
    # no install, like the rest of this package. They are called by path, not
    # by `uses: .../notifications@main`: this action and the scripts always
    # come from the same ref, so a branch that changes both stays consistent.
    #
    # The gate is the opt-out plus either a PR event or a PR_NUMBER the caller
    # passed. A push or schedule run with neither has no PR to comment on, and
    # pull_request_target is allowed because its token can write even for fork
    # PRs. A workflow_run reporter passes the PR number it verified.
    - name: Format PR comment
      id: format
      shell: bash
      if: ${{ inputs.COMMENT_ON_PR == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || inputs.PR_NUMBER != '') }}
      # A formatting error must not fail the check it is reporting on, unless the
      # caller is a reporter whose only job is the comment.
      continue-on-error: ${{ inputs.FAIL_ON_ERROR != 'true' }}
      run: |
        node "${{ github.action_path }}/../dist/format-comment/index.js"
      env:
        KIND: ${{ inputs.KIND }}
        DATA: ${{ inputs.DATA }}
        # For file:line links in the spellcheck comment: the PR head commit,
        # or the run's commit outside a PR. Env only, never in the run string.
        REPO: ${{ inputs.GITHUB_ORG || github.repository }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Upsert PR comment
      id: upsert
      shell: bash
      if: ${{ steps.format.outcome == 'success' }}
      continue-on-error: ${{ inputs.FAIL_ON_ERROR != 'true' }}
      run: |
        node "${{ github.action_path }}/../dist/upsert-comment/index.js"
      env:
        FAIL_ON_ERROR: ${{ inputs.FAIL_ON_ERROR }}
        GH_TOKEN: ${{ inputs.GH_TOKEN || github.token }}
        ORG: ${{ inputs.GITHUB_ORG || github.repository }}
        PR_NUMBER: ${{ inputs.PR_NUMBER || github.event.pull_request.number }}
        MARKER: ${{ inputs.KIND }}
        COMMENT_KEY: ${{ inputs.COMMENT_KEY }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MESSAGE: ${{ steps.format.outputs.BODY }}
