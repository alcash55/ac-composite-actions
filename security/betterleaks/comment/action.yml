name: Comment on secret scan
description: Verify a redacted scan artifact against its source PR and update the finding comment.
inputs:
  REPORT_PATH:
    description: Path to downloaded result.json, treated only as data.
    required: true
outputs: {}
runs:
  using: composite
  steps:
    - name: Verify report provenance and current PR head
      id: verify
      shell: bash
      run: node "$ACTION_PATH/../dist/comment.js"
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_PATH: ${{ inputs.REPORT_PATH }}
        GH_TOKEN: ${{ github.token }}
    # An empty DATA means verification refused the report (a stale head, another PR's
    # run). Skipping the step then leaves the existing comment alone, where pr-comment
    # would read an empty string as "clean" and delete it.
    - name: Update PR comment
      if: ${{ steps.verify.outputs.DATA != '' }}
      uses: alcash55/ac-composite-actions/notifications/pr-comment@main
      with:
        KIND: secrets
        DATA: ${{ steps.verify.outputs.DATA }}
        PR_NUMBER: ${{ steps.verify.outputs.PR_NUMBER }}
        FAIL_ON_ERROR: "true"
